name: forecast

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: which tournaments to poll
        type: choice
        default: tournament
        options: [tournament, seasonal, minibench, test]
      dry_run:
        description: run without submitting
        type: boolean
        default: false
      watch:
        description: keep polling for four hours instead of one pass
        type: boolean
        default: false

concurrency:
  group: forecast-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: forecast
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m bot.runner \
            --mode "${{ inputs.mode || 'tournament' }}" \
            ${{ (github.event_name == 'schedule' || inputs.watch) && '--watch 14400 --interval 240' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

